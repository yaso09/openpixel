[package]
name = "openpixel-renderer-core"
version = "0.1.0"
edition = "2021"
description = "Rust SVG renderer shared by OpenPixel native and WebAssembly packages"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
