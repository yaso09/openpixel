[package]
name = "openpixel-cli"
version = "0.3.0"
edition = "2021"
description = "Create, inspect, validate, and render OpenPixel artwork"
license = "MIT"

[[bin]]
name = "openpixel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }
