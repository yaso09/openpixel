<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenPixel revision comparison</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 system-ui,sans-serif; background: #111820; color: #eef2ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 24px; border-bottom: 1px solid #303b45; background: #18222b; }
    h1 { margin: 0; font-size: 16px; font-weight: 650; }
    .toolbar,.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    button,select,input { color: inherit; font: inherit; }
    button,select { border: 1px solid #46545e; border-radius: 7px; padding: 8px 12px; background: #202d36; }
    button { cursor: pointer; }
    button[aria-pressed="true"] { border-color: #a6ed92; background: #293d38; color: #c2f0a6; }
    main { flex: 1; display: flex; flex-direction: column; padding: 18px; min-height: 0; }
    .controls { justify-content: center; min-height: 46px; color: #b4c0c4; }
    .stage { flex: 1; min-height: 240px; display: grid; place-items: center; overflow: auto; }
    .pair { width: 100%; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; align-items: start; }
    figure { min-width: 0; margin: 0; display: grid; gap: 8px; justify-items: center; }
    figcaption { color: #bdc8ca; font-size: 12px; }
    .art { position: relative; display: grid; place-items: center; width: min(100%,640px); min-height: 160px; max-height: calc(100vh - 190px); aspect-ratio: var(--ratio,1); overflow: hidden; background-color: #202a32; background-image: linear-gradient(45deg,#29343d 25%,transparent 25%),linear-gradient(-45deg,#29343d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#29343d 75%),linear-gradient(-45deg,transparent 75%,#29343d 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
    .art svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    .overlay { position: relative; width: min(100%,760px); max-height: calc(100vh - 190px); aspect-ratio: var(--ratio,1); overflow: hidden; background-color: #202a32; background-image: linear-gradient(45deg,#29343d 25%,transparent 25%),linear-gradient(-45deg,#29343d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#29343d 75%),linear-gradient(-45deg,transparent 75%,#29343d 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
    .overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .diff svg { position: static; display: block; width: min(100%,760px); max-height: calc(100vh - 190px); image-rendering: pixelated; }
    .legend { display: flex; justify-content: center; gap: 18px; margin: 10px; color: #b4c0c4; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .status { min-height: 20px; padding: 0 24px 12px; color: #90a1a7; text-align: center; }
    .hidden { display: none !important; }
    @media(max-width:680px) { header { padding: 14px; } main { padding: 12px; } .pair { grid-template-columns: 1fr; } .art { width: min(100%,520px); } }
  </style>
</head>
<body>
  <header>
    <h1>OpenPixel revision comparison</h1>
    <nav class="toolbar" aria-label="Comparison view">
      <button data-mode="side" aria-pressed="true">Side by side</button>
      <button data-mode="overlay" aria-pressed="false">Overlay</button>
      <button data-mode="diff" aria-pressed="false">Diff view</button>
    </nav>
  </header>
  <main>
    <div class="controls">
      <label for="frame">Frame</label>
      <select id="frame" aria-label="Animation frame"></select>
      <label id="blend-label" class="hidden" for="blend">New revision opacity</label>
      <input id="blend" class="hidden" type="range" min="0" max="100" value="50" aria-label="New revision opacity">
    </div>
    <section id="side" class="stage"><div class="pair">
      <figure><figcaption id="before-label"></figcaption><div class="art" id="before"></div></figure>
      <figure><figcaption id="after-label"></figcaption><div class="art" id="after"></div></figure>
    </div></section>
    <section id="overlay-view" class="stage hidden"><div class="overlay" id="overlay"></div></section>
    <section id="diff-view" class="stage hidden"><div><div class="diff" id="diff"></div><div class="legend"><span><i class="dot" style="background:#ff647c"></i>Removed</span><span><i class="dot" style="background:#70f0a2"></i>Added</span><span><i class="dot" style="background:#ffd166"></i>Changed</span></div></div></section>
  </main>
  <div id="status" class="status" role="status"></div>
  <script id="before-data" type="application/json">__OPENPIXEL_BEFORE__</script>
  <script id="after-data" type="application/json">__OPENPIXEL_AFTER__</script>
  <script>
    const before = JSON.parse(document.querySelector('#before-data').textContent);
    const after = JSON.parse(document.querySelector('#after-data').textContent);
    const state = { mode: 'side', frame: 0, urls: [] };
    const maxWidth = Math.max(before.width, after.width);
    const maxHeight = Math.max(before.height, after.height);
    const maxFrames = Math.max(before.frames.length, after.frames.length);
    const revision = art => Number.isInteger(art.revision) && art.revision > 0 ? art.revision : 1;
    document.querySelector('#before-label').textContent = `Previous · revision ${revision(before)}`;
    document.querySelector('#after-label').textContent = `Current · revision ${revision(after)}`;
    document.querySelector('.overlay').style.setProperty('--ratio', `${maxWidth}/${maxHeight}`);
    document.querySelectorAll('.art').forEach(el => el.style.setProperty('--ratio', `${maxWidth}/${maxHeight}`));
    for (let i=0;i<maxFrames;i++) { const option=document.createElement('option'); option.value=String(i); option.textContent=`${i+1} / ${maxFrames}`; document.querySelector('#frame').append(option); }
    function svgFor(art,index,outerWidth=maxWidth,outerHeight=maxHeight) {
      const frame=art.frames[Math.min(index,art.frames.length-1)];
      const groups=[];
      for (const layer of art.layers) {
        if (layer.visible===false) continue;
        const entry=frame.layers.find(item=>item.layerId===layer.id);
        if (!entry) continue;
        const rects=[];
        entry.pixels.forEach((row,y)=>row.forEach((color,x)=>{ if(color) rects.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`); }));
        groups.push(`<g opacity="${layer.opacity ?? 1}">${rects.join('')}</g>`);
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${outerWidth} ${outerHeight}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">${groups.join('')}</svg>`;
    }
    function setSvg(target,markup,opacity=1,append=false) {
      if(!append) target.replaceChildren();
      const wrapper=document.createElement('div'); wrapper.innerHTML=markup;
      const svg=wrapper.firstElementChild;
      if(svg) { svg.style.opacity=String(opacity); target.append(svg); }
      return svg;
    }
    function composite(art,index) {
      const frame=art.frames[Math.min(index,art.frames.length-1)];
      const out=Array.from({length:maxWidth*maxHeight},()=>[0,0,0,0]);
      for(const layer of art.layers) {
        if(layer.visible===false) continue;
        const entry=frame.layers.find(item=>item.layerId===layer.id); if(!entry) continue;
        const opacity=layer.opacity ?? 1;
        entry.pixels.forEach((row,y)=>row.forEach((color,x)=>{
          if(!color || x>=maxWidth || y>=maxHeight) return;
          const rgb=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)];
          const alpha=(color.length===9?parseInt(color.slice(7,9),16)/255:1)*opacity;
          const dst=out[y*maxWidth+x], a=alpha+dst[3]*(1-alpha);
          if(a===0)return;
          for(let c=0;c<3;c++) dst[c]=(rgb[c]*alpha+dst[c]*dst[3]*(1-alpha))/a;
          dst[3]=a;
        }));
      }
      return out;
    }
    function diffSvg(index) {
      const oldPixels=composite(before,index), newPixels=composite(after,index), rects=[];
      for(let y=0;y<maxHeight;y++) for(let x=0;x<maxWidth;x++) {
        const a=oldPixels[y*maxWidth+x],b=newPixels[y*maxWidth+x];
        if(a.every((v,c)=>Math.abs(v-b[c])<0.01)) continue;
        const color=a[3]<0.01?'#70f0a2':b[3]<0.01?'#ff647c':'#ffd166';
        rects.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`);
      }
      const faint=svgFor(after,index).replace('<svg ','<svg opacity="0.16" ');
      const inner=faint.slice(faint.indexOf('>')+1,faint.lastIndexOf('</svg>'));
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${maxWidth} ${maxHeight}" shape-rendering="crispEdges">${inner}${rects.join('')}</svg>`;
    }
    function render() {
      for(const url of state.urls) URL.revokeObjectURL(url); state.urls=[];
      const index=state.frame;
      const oldSvg=svgFor(before,index), newSvg=svgFor(after,index);
      setSvg(document.querySelector('#before'),oldSvg);
      setSvg(document.querySelector('#after'),newSvg);
      const overlay=document.querySelector('#overlay');
      setSvg(overlay,oldSvg);
      setSvg(overlay,newSvg,Number(document.querySelector('#blend').value)/100,true);
      setSvg(document.querySelector('#diff'),diffSvg(index));
      document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===state.mode)));
      document.querySelector('#side').classList.toggle('hidden',state.mode!=='side');
      document.querySelector('#overlay-view').classList.toggle('hidden',state.mode!=='overlay');
      document.querySelector('#diff-view').classList.toggle('hidden',state.mode!=='diff');
      document.querySelector('#blend').classList.toggle('hidden',state.mode!=='overlay');
      document.querySelector('#blend-label').classList.toggle('hidden',state.mode!=='overlay');
      document.querySelector('#status').textContent=`Comparing revision ${revision(before)} with revision ${revision(after)} · frame ${index+1}`;
    }
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{state.mode=button.dataset.mode;render();}));
    document.querySelector('#frame').addEventListener('change',event=>{state.frame=Number(event.target.value);render();});
    document.querySelector('#blend').addEventListener('input',render);
    render();
  </script>
</body>
</html>
