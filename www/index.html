<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101b20" />
  <meta name="description" content="OpenPixel — pixel art in motion." />
  <title>OpenPixel</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="scene">
    <button id="landscape" class="landscape" aria-label="Advance the animated pixel-art landscape">
      <img id="landscape-frame" src="./assets/landscape/frame-1.svg" alt="Pixel-art mountain lake at sunset" />
    </button>
  </main>
  <footer class="install-bar">
    <code id="install-command" data-pixel-text data-pixel-size="2" aria-label="npm install @openpixel/renderer">npm install @openpixel/renderer</code>
    <button id="copy-command" class="copy" aria-label="Copy installation command"><span data-pixel-text data-pixel-size="1" aria-hidden="true">COPY</span></button>
    <span id="copy-status" class="sr-only" aria-live="polite"></span>
  </footer>
</body>
</html>
